collections:
  fics:
    output: true

defaults:
  - scope:
      path: "_fics/*.md"
      type: fics
    values:
      layout: fic-data
      permalink: /fic-data/:name/work.js

kramdown:
  smart_quotes: "39,39,34,34"
  typographic_symbols:
    hellip: "..."
    mdash: "---"
    ndash: "--"
    laquo: "<<"
    raquo: ">>"
    laquo_space: "<< "
    raquo_space: " >>"

exclude:
  - _pages
  - "Atualizar biblioteca.cmd"
  - "Importar PDFs.cmd"
  - "Importar fanfics.cmd"
  - "Archive of MY own"
  - "_fics/ao3-*--*.md"
  - "_fics/local-*--*.md"
  - .radioapple-import
  - .venv
  - venv
  - __pycache__
  - .pytest_cache
  - docs
  - tools
  - tests
  - requirements-import.txt
  - fic-template.md
  - radioapple-reader.zip
